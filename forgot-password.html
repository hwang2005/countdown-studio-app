<!doctype html>
<html lang="en" data-theme="classic-blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — Countdown Studio</title>
    <meta
      name="description"
      content="Request a password reset email for your Countdown Studio account. The reset link is single-use and expires after 30 minutes."
    />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/animations.css" />
    <style>
      .recover-card {
        max-width: 420px;
        width: 100%;
        margin: clamp(2rem, 8vh, 5rem) auto;
      }
      .recover-card__icon {
        font-size: 2rem;
        line-height: 1;
      }
      .recover-card__lead {
        color: var(--text-secondary);
        font-size: 0.9375rem;
        line-height: 1.55;
        margin: 0 0 1.25rem;
      }
      .recover-actions {
        display: flex;
        gap: .5rem;
        margin-top: .75rem;
      }
    </style>
  </head>
  <body class="auth-page">
    <a href="#recover-section" class="skip-link">Skip to password recovery form</a>

    <header class="top-bar" role="banner">
      <a href="./index.html" class="top-bar__brand" aria-label="Countdown Studio Home">
        Countdown Studio
      </a>
      <nav class="top-bar__nav" aria-label="Primary navigation">
        <a href="./index.html" class="top-bar__link">Home</a>
        <a href="./contact.html" class="top-bar__link">Contact</a>
      </nav>
      <div class="top-bar__action">
        <a href="./login.html" class="btn btn--secondary btn--sm">Sign in</a>
      </div>
    </header>

    <main id="main">
      <section id="recover-section" class="auth-card recover-card" aria-label="Password recovery">
        <div class="recover-card__icon" aria-hidden="true">🔑</div>
        <h1 style="font-size:1.35rem;margin:.6rem 0 .5rem">Forgot your password?</h1>
        <p class="recover-card__lead">
          Enter the email address on your account and we'll send you a single-use reset link
          (valid for 30 minutes by default — the exact expiry is stated in the email).
        </p>

        <div id="recover-alert" class="auth-alert auth-alert--info" role="alert" aria-live="polite" hidden>
          <span id="recover-alert-icon" aria-hidden="true">ℹ️</span>
          <span id="recover-alert-text"></span>
        </div>

        <form id="recover-form" class="auth-form" novalidate>
          <div class="auth-field">
            <label for="recover-email" class="auth-label">Account email</label>
            <input
              id="recover-email"
              type="email"
              name="email"
              class="input-field"
              placeholder="you@example.com"
              autocomplete="email"
              maxlength="254"
              spellcheck="false"
              required
            />
          </div>
          <button type="submit" id="btn-recover" class="btn btn--primary btn--block btn--lg">
            Send reset link
          </button>
          <div class="recover-actions">
            <a href="./login.html" class="btn btn--secondary btn--block">← Back to sign in</a>
          </div>
        </form>
      </section>
    </main>

    <script type="module">
      import { apiFetch } from './js/net/api.js';

      (() => {
        const form = document.getElementById('recover-form');
        const emailInput = document.getElementById('recover-email');
        const submitBtn = document.getElementById('btn-recover');
        const alertBox = document.getElementById('recover-alert');
        const alertIcon = document.getElementById('recover-alert-icon');
        const alertText = document.getElementById('recover-alert-text');

        const ALERT_ICONS = { info: 'ℹ️', success: '✅', error: '⚠️', warning: '⚠️' };

        function setAlert(kind, message) {
          if (!message) {
            alertBox.hidden = true;
            return;
          }
          alertIcon.textContent = ALERT_ICONS[kind] || ALERT_ICONS.info;
          alertText.textContent = message;
          alertBox.classList.remove('auth-alert--info', 'auth-alert--success', 'auth-alert--error', 'auth-alert--warning');
          alertBox.classList.add(`auth-alert--${kind}`);
          alertBox.hidden = false;
        }
        setAlert(null);

        // Prefill from ?email=… so the login page can pass the typed identifier.
        const prefill = new URLSearchParams(window.location.search).get('email');
        if (prefill) emailInput.value = prefill.trim().slice(0, 254);

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const email = emailInput.value.trim();
          setAlert(null);

          if (!/^\S+@\S+\.\S+$/.test(email)) {
            setAlert('warning', 'Please enter a valid email address.');
            emailInput.focus();
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending…';
          try {
            // apiFetch resolves the backend origin (window.__COUNTDOWN_API_URL__
            // / ?api= / localStorage / same-origin) so this page also works on
            // static custom-domain deployments that cannot serve /api.
            const response = await apiFetch('/api/auth/forgot-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email }),
            });
            const data = await response.json().catch(() => ({}));

            if (response.ok) {
              // Always the generic message — never confirm whether the
              // address exists, to prevent account enumeration.
              setAlert('success', data.message || 'If that email address belongs to an account, a password reset link has been sent.');
              form.reset();
              emailInput.disabled = true;
              submitBtn.textContent = 'Request again later';
              return;
            }

            if (response.status === 429) {
              setAlert('warning', data.message || 'Too many requests. Please try again later.');
              submitBtn.textContent = 'Send reset link';
              submitBtn.disabled = false;
              return;
            }

            setAlert('error', data.message || 'Could not send the reset email. Please try again later.');
            submitBtn.textContent = 'Send reset link';
            submitBtn.disabled = false;
          } catch {
            setAlert('error', 'Network error. Please check your connection and try again.');
            submitBtn.textContent = 'Send reset link';
            submitBtn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
