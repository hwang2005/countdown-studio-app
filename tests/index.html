<!doctype html>
<html lang="en" data-theme="classic-blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var _fetch = window.fetch;
        function setup(target) {
          if (!target) return;
          try {
            Object.defineProperty(target, 'fetch', {
              get: function () { return _fetch; },
              set: function (fn) { _fetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        }
        setup(window);
        try { setup(Window.prototype); } catch (e) {}
        try { if (window.__proto__) setup(window.__proto__); } catch (e) {}

        window.addEventListener(
          'error',
          function (e) {
            var msg = (e && (e.message || (e.error && e.error.message))) || '';
            var file = (e && e.filename) || '';
            if (file.indexOf('chrome-extension://') !== -1 || msg.indexOf('Cannot set property fetch') !== -1) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = (e && e.reason && (e.reason.message || String(e.reason))) || '';
            if (reason.indexOf('Cannot set property fetch') !== -1) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>Self-Contained Unit Test Suite — Countdown Studio</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body>
    <header class="top-bar">
      <a href="../index.html" class="top-bar__brand">Countdown Studio</a>
      <nav class="top-bar__nav" aria-label="Primary navigation">
        <a href="../solo.html" class="top-bar__link" data-auth-permission="solo:practice">Solo Practice</a>
        <a href="../versus-host.html" class="top-bar__link" data-auth-permission="host:operations">Versus Host</a>
        <a href="../versus-display.html" class="top-bar__link" data-auth-permission="stage:display">Stage Display</a>
      </nav>
      <div class="top-bar__action">
        <a href="../index.html" class="btn btn--secondary btn--sm">Back to Studio</a>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
          <div>
            <h1 style="font-size: 1.6rem;">Authoritative Unit Test Suite</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">
              Zero-dependency browser assertions testing pure game logic, FSM transitions, scoring, and solvers.
            </p>
          </div>
          <div id="test-summary-badge" class="font-mono" style="font-size: 1.15rem; font-weight: 700;">
            Running…
          </div>
        </div>

        <div id="test-results-list" class="font-mono" style="display: grid; gap: 0.5rem; font-size: 0.875rem;"></div>
      </section>
    </main>

    <script type="module">
      import { createRNG } from '../js/core/rng.js';
      import { PHASES, canTransition, GameStore } from '../js/core/state.js';
      import {
        createLetterStacks,
        getPickConstraints,
        pickLetterTile,
        pickRandomRemainingLetters,
        validateWordSubmission
      } from '../js/game/letters.js';
      import {
        drawNumbersTiles,
        evaluateStep,
        validateCalculationSequence
      } from '../js/game/numbers.js';
      import {
        scrambleConundrum,
        pickConundrum,
        checkConundrumGuess,
        adjudicateBuzz
      } from '../js/game/conundrum.js';
      import {
        scoreSingleWord,
        scoreVersusLettersRound,
        scoreSingleNumbers,
        scoreVersusNumbersRound
      } from '../js/game/scoring.js';
      import { buildCustomDictionary, solveLettersRound } from '../js/solver/wordSolver.js';
      import { solveNumbersRound } from '../js/solver/numbersSolver.js';
      import {
        getRequiredPermissionForHref,
        getPermissionMetadata,
        hasPermission,
        applyPermissionGuards
      } from '../js/auth.js';

      const listEl = document.getElementById('test-results-list');
      const summaryEl = document.getElementById('test-summary-badge');
      let passed = 0;
      let failed = 0;

      function assert(name, condition, details = '') {
        const row = document.createElement('div');
        row.className = 'panel--subtle';
        row.style.padding = '0.6rem 0.9rem';
        row.style.borderColor = condition ? 'var(--status-valid)' : 'var(--status-invalid)';
        if (condition) {
          passed += 1;
          row.textContent = `✓ PASS: ${name}`;
          row.style.color = 'var(--status-valid)';
        } else {
          failed += 1;
          row.textContent = `✗ FAIL: ${name} ${details ? `(${details})` : ''}`;
          row.style.color = 'var(--status-invalid)';
        }
        listEl.appendChild(row);
      }

      // 1. Letter-stack & 3V/4C constraint validation
      {
        const rng = createRNG('test-seed-1');
        const stacks = createLetterStacks(rng);
        assert('Vowel stack has 67 tiles (TV distribution)', stacks.vowels.length === 67);
        assert('Consonant stack has 74 tiles (TV distribution)', stacks.consonants.length === 74);

        const c5Vowels = getPickConstraints(5, 2);
        assert('Disables Vowel button after 5 vowels picked (ensures >= 4 consonants)', c5Vowels.canPickVowel === false && c5Vowels.canPickConsonant === true);

        const c6Consonants = getPickConstraints(1, 6);
        assert('Disables Consonant button after 6 consonants picked (ensures >= 3 vowels)', c6Consonants.canPickConsonant === false && c6Consonants.canPickVowel === true);

        const randPick = pickRandomRemainingLetters(stacks, [], rng);
        assert('Random 9-letter pick produces 9 tiles with >=3 vowels and >=4 consonants', randPick.board.length === 9 && randPick.vowelCount >= 3 && randPick.consonantCount >= 4);
      }

      // 2. Letters word multiset & dictionary validation edge cases
      {
        const { wordSet, trie } = buildCustomDictionary(['stone', 'tones', 'not', 'count', 'countdown']);
        const board = ['C', 'O', 'U', 'N', 'T', 'D', 'O', 'W', 'N'];

        assert('Rejects empty word submission', validateWordSubmission('', board, wordSet).valid === false);
        assert('Rejects 1-letter word submission', validateWordSubmission('A', board, wordSet).valid === false);
        assert('Rejects word with non-letters', validateWordSubmission('CO-NT', board, wordSet).valid === false);
        assert('Rejects reusing a letter more times than drawn on board', validateWordSubmission('CCC', board, wordSet).reason === 'missing_letters');
        assert('Accepts valid 9-letter word COUNTDOWN using exact multiset', validateWordSubmission('countdown', board, wordSet).valid === true);

        const inflectionDictionary = buildCustomDictionary([
          'walk', 'stop', 'make', 'run', 'study', 'panic', 'city', 'box', 'knife',
          'hero', 'quiz', 'eat', 'swim', 'buy', 'write', 'lie', 'child', 'tooth',
          'foot', 'mouse', 'cactus', 'crisis'
        ]).wordSet;

        // Past tense verbs (regular and irregular)
        assert(
          'Accepts regular past-tense verb WALKED from WALK',
          validateWordSubmission('walked', ['W', 'A', 'L', 'K', 'E', 'D'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts doubled-consonant past-tense STOPPED from STOP',
          validateWordSubmission('stopped', ['S', 'T', 'O', 'P', 'P', 'E', 'D'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts -cked past-tense PANICKED from PANIC',
          validateWordSubmission('panicked', ['P', 'A', 'N', 'I', 'C', 'K', 'E', 'D'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular past-tense ATE from EAT',
          validateWordSubmission('ate', ['A', 'T', 'E', 'X', 'Y', 'Z'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular past-tense RAN from RUN',
          validateWordSubmission('ran', ['R', 'A', 'N', 'X', 'Y', 'Z'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular past-tense SWAM from SWIM',
          validateWordSubmission('swam', ['S', 'W', 'A', 'M', 'X', 'Y'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular past-tense BOUGHT from BUY',
          validateWordSubmission('bought', ['B', 'O', 'U', 'G', 'H', 'T'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular past-tense WROTE from WRITE',
          validateWordSubmission('wrote', ['W', 'R', 'O', 'T', 'E', 'X'], inflectionDictionary).valid === true
        );

        // Present continuous (-ing / present participle)
        assert(
          'Accepts dropped-e present participle MAKING from MAKE',
          validateWordSubmission('making', ['M', 'A', 'K', 'I', 'N', 'G'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts doubled-consonant present participle RUNNING from RUN',
          validateWordSubmission('running', ['R', 'U', 'N', 'N', 'I', 'N', 'G'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts -ying present participle LYING from LIE',
          validateWordSubmission('lying', ['L', 'Y', 'I', 'N', 'G', 'X'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts -cking present participle PANICKING from PANIC',
          validateWordSubmission('panicking', ['P', 'A', 'N', 'I', 'C', 'K', 'I', 'N', 'G'], inflectionDictionary).valid === true
        );

        // Plural nouns (regular, f/fe, -es, irregular, Latin/Greek)
        assert(
          'Accepts regular plural noun CITIES from CITY',
          validateWordSubmission('cities', ['C', 'I', 'T', 'I', 'E', 'S'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts regular plural noun KNIVES from KNIFE',
          validateWordSubmission('knives', ['K', 'N', 'I', 'V', 'E', 'S'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts -es plural noun BOXES from BOX',
          validateWordSubmission('boxes', ['B', 'O', 'X', 'E', 'S', 'X'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts -oes plural noun HEROES from HERO',
          validateWordSubmission('heroes', ['H', 'E', 'R', 'O', 'E', 'S'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts doubled-consonant plural QUIZZES from QUIZ',
          validateWordSubmission('quizzes', ['Q', 'U', 'I', 'Z', 'Z', 'E', 'S'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular plural noun CHILDREN from CHILD',
          validateWordSubmission('children', ['C', 'H', 'I', 'L', 'D', 'R', 'E', 'N'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular plural noun TEETH from TOOTH',
          validateWordSubmission('teeth', ['T', 'E', 'E', 'T', 'H', 'X'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular plural noun FEET from FOOT',
          validateWordSubmission('feet', ['F', 'E', 'E', 'T', 'X', 'Y'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts irregular plural noun MICE from MOUSE',
          validateWordSubmission('mice', ['M', 'I', 'C', 'E', 'X', 'Y'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts Latin plural noun CACTI from CACTUS',
          validateWordSubmission('cacti', ['C', 'A', 'C', 'T', 'I', 'X'], inflectionDictionary).valid === true
        );
        assert(
          'Accepts Greek plural noun CRISES from CRISIS',
          validateWordSubmission('crises', ['C', 'R', 'I', 'S', 'E', 'S'], inflectionDictionary).valid === true
        );

        // Rejections of invalid/uninflected non-words
        assert(
          'Still rejects an unknown double-inflection walkings',
          validateWordSubmission('walkings', ['W', 'A', 'L', 'K', 'I', 'N', 'G', 'S'], inflectionDictionary).valid === false
        );
        assert(
          'Rejects invalid plural foots when irregular is feet',
          validateWordSubmission('foots', ['F', 'O', 'O', 'T', 'S', 'X'], inflectionDictionary).valid === false
        );

        const solved = solveLettersRound(board, trie, 10);
        assert('WordTrie solver finds 9-letter word COUNTDOWN first', solved.topWords[0] === 'COUNTDOWN' && solved.maxLength === 9);
        assert('Dictionary Corner only returns words at the maximum length', solved.topWords.every((word) => word.length === solved.maxLength));
      }

      // 3. Numbers round validation & edge cases
      {
        const tiles = drawNumbersTiles(2, createRNG('num-seed'));
        const largeCount = tiles.filter((n) => n >= 25).length;
        assert('Numbers draw with 2 large tiles returns 2 large and 4 small', tiles.length === 6 && largeCount === 2);

        assert('Rejects non-exact division (75 ÷ 2)', evaluateStep(75, '/', 2).valid === false);
        assert('Rejects zero or negative subtraction (25 − 50)', evaluateStep(25, '-', 50).valid === false);
        assert('Accepts exact division (100 ÷ 25 = 4)', evaluateStep(100, '/', 25).result === 4);

        const seqValid = validateCalculationSequence([75, 50, 2, 3, 6, 1], [
          { a: 75, op: '+', b: 50 },
          { a: 125, op: '*', b: 2 }
        ]);
        assert('Validates multi-step calculation sequence consuming intermediate tile', seqValid.valid === true && seqValid.finalValue === 250);

        const seqReuse = validateCalculationSequence([75, 50, 2, 3, 6, 1], [
          { a: 75, op: '+', b: 75 }
        ]);
        assert('Rejects reusing a single 75 tile twice', seqReuse.valid === false);
      }

      // 4. Numbers Solver accuracy & speed (< 300ms)
      {
        const sol = solveNumbersRound([100, 75, 50, 25, 6, 3], 952);
        // Famous 952 target! Wait: 952 with [100, 75, 50, 25, 6, 3] is reachable!
        assert(`Numbers solver finds exact or closest solution in ${sol.elapsedMs}ms (< 300ms)`, sol.elapsedMs < 300 && sol.exact === true && sol.bestValue === 952);
      }

      // 5. Scoring rules (Letters, Numbers, Versus only-longer-scores)
      {
        assert('8-letter valid word scores 8 points', scoreSingleWord('BUILDINGS'.slice(0, 8), true) === 8);
        assert('9-letter valid word scores 18 points (double)', scoreSingleWord('COUNTDOWN', true) === 18);

        const vsDiff = scoreVersusLettersRound(
          { word: 'STREAM', valid: true },
          { word: 'MASTERING', valid: true },
          { onlyLongerScores: true }
        );
        assert('Versus Letters: only the longer valid word scores (0 vs 18)', vsDiff.p1Points === 0 && vsDiff.p2Points === 18);

        const vsTie = scoreVersusLettersRound(
          { word: 'STONE', valid: true },
          { word: 'NOTES', valid: true },
          { onlyLongerScores: true }
        );
        assert('Versus Letters: equal-length valid words both score (5 and 5)', vsTie.p1Points === 5 && vsTie.p2Points === 5);

        assert('Numbers scoring: exact=10, within 5=7, within 10=5, 11 away=0',
          scoreSingleNumbers(500, 500).points === 10 &&
          scoreSingleNumbers(496, 500).points === 7 &&
          scoreSingleNumbers(491, 500).points === 5 &&
          scoreSingleNumbers(488, 500).points === 0
        );
      }

      // 6. Conundrum scramble & buzzer adjudication
      {
        const rng = createRNG('con-seed');
        const scrambled = scrambleConundrum('ASTRONOMY', rng);
        const sameMultiset = scrambled.split('').sort().join('') === 'ASTRONOMY'.split('').sort().join('');
        assert('Conundrum scramble preserves exact letters and is never identical to original word', scrambled !== 'ASTRONOMY' && sameMultiset);
        assert('Conundrum guess check is case-insensitive', checkConundrumGuess('astronomy', 'ASTRONOMY') === true);

        const multiAnswer = pickConundrum([
          { source: 'MISSATTEE', answers: ['ESTIMATES', 'STEAMIEST'] }
        ], () => 0.1);
        assert(
          'Conundrum supports explicit source letters and multiple accepted answers',
          multiAnswer.scrambled === 'MISSATTEE' &&
          checkConundrumGuess('estimates', multiAnswer.answers) &&
          checkConundrumGuess('STEAMIEST', multiAnswer.answers)
        );
        assert(
          'Conundrum rejects unlisted anagrams',
          checkConundrumGuess('SMARTENED', ['TRADESMEN']) === false
        );

        const buzzRes = adjudicateBuzz(
          { player: 1, timestamp: 105.2 },
          { player: 2, timestamp: 102.8 }
        );
        assert('Buzzer adjudication awards earliest high-res timestamp & flags <15ms near-tie', buzzRes.winner === 2 && buzzRes.tooClose === true);
      }

      // 7. Finite State Machine transition enforcement
      {
        assert('FSM allows PICKING -> CLOCK_RUNNING', canTransition(PHASES.PICKING, PHASES.CLOCK_RUNNING) === true);
        assert('FSM blocks illegal transition IDLE -> SCORING', canTransition(PHASES.IDLE, PHASES.SCORING) === false);

        const store = new GameStore();
        let threw = false;
        try {
          store.transition(PHASES.SCORING);
        } catch {
          threw = true;
        }
        assert('GameStore throws error on illegal state transition', threw === true);
      }

      // 8. RBAC and Link Protection Enforcement
      {
        assert('Route resolver maps solo.html to solo:practice', getRequiredPermissionForHref('./solo.html') === 'solo:practice');
        assert('Route resolver maps versus-host.html to host:operations', getRequiredPermissionForHref('./versus-host.html') === 'host:operations');
        assert('Route resolver maps versus-display.html to stage:display', getRequiredPermissionForHref('./versus-display.html') === 'stage:display');
        assert('Route resolver ignores general links', getRequiredPermissionForHref('./index.html') === null);

        const testContainer = document.createElement('div');
        testContainer.id = 'test-rbac-container';
        testContainer.innerHTML = `
          <a id="test-link-solo" href="./solo.html">Solo</a>
          <a id="test-link-host" href="./versus-host.html">Host</a>
          <a id="test-link-display" href="./versus-display.html">Display</a>
        `;
        document.body.appendChild(testContainer);

        // Simulate Individual player account
        localStorage.setItem('countdown_studio_auth_user_v1', JSON.stringify({
          username: 'player_test',
          role: 'individual',
          permissions: ['solo:practice']
        }));

        applyPermissionGuards();

        const soloLink = document.getElementById('test-link-solo');
        const hostLink = document.getElementById('test-link-host');
        const displayLink = document.getElementById('test-link-display');

        assert('Player can access solo link (not locked)', !soloLink.classList.contains('is-permission-locked') && soloLink.hasAttribute('href'));
        assert('Player cannot access host link (is locked)', hostLink.classList.contains('is-permission-locked'));
        assert('Player host link href removed to data-restricted-href', !hostLink.hasAttribute('href') && hostLink.getAttribute('data-restricted-href') === './versus-host.html');
        assert('Player host link has aria-disabled and tabindex=-1', hostLink.getAttribute('aria-disabled') === 'true' && hostLink.getAttribute('tabindex') === '-1');
        assert('Player host link wrapped in not-allowed container', hostLink.parentElement.classList.contains('auth-restricted-wrap'));
        assert('Player cannot access display link (is locked)', displayLink.classList.contains('is-permission-locked'));

        // Clean up test elements
        testContainer.remove();
        localStorage.removeItem('countdown_studio_auth_user_v1');
      }

      // ==========================================
      // GOOGLE OAUTH & PASSWORD SETUP INTEGRATION
      // ==========================================
      {
        try {
          const cfgRes = await fetch('/api/auth/config');
          const cfg = await cfgRes.json();
          assert('Auth config endpoint returns googleAuthEnabled flag', cfg.googleAuthEnabled === true);
          assert('Auth config includes googleClientId key', typeof cfg.googleClientId === 'string');

          // Test Google Auth Flow requires password setup for new accounts
          const testGoogleEmail = `unit_test_${Date.now()}@countdown.example`;
          const googleRes = await fetch('/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              isDemo: true,
              demoUser: {
                email: testGoogleEmail,
                name: 'Unit Test Player',
                sub: `test_sub_${Date.now()}`
              }
            })
          });
          const googleData = await googleRes.json();
          assert('New Google registration returns requirePasswordSetup: true', googleData.requirePasswordSetup === true);
          assert('New Google registration returns signed setupToken', typeof googleData.setupToken === 'string' && googleData.setupToken.length > 20);
          assert('New Google registration suggests sanitized username', typeof googleData.suggestedUsername === 'string');

          // Test Password Setup Endpoint saves credentials to database
          const setupRes = await fetch('/api/auth/google/set-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              setupToken: googleData.setupToken,
              password: 'UnitPassword2026!',
              username: `unit_${Date.now().toString().slice(-8)}`,
              displayName: 'Unit Test Player'
            })
          });
          const setupData = await setupRes.json();
          assert('Setting initialized password returns 201 Created', setupRes.status === 201);
          assert('Setting initialized password returns authenticated session token', typeof setupData.token === 'string' && setupData.token.length > 20);
          assert('Setting initialized password assigns individual player role', setupData.user && setupData.user.role === 'individual');
        } catch (e) {
          assert('Google OAuth and password setup integration tests pass', false);
        }
      }

      summaryEl.textContent = `${passed} Passed · ${failed} Failed`;
      summaryEl.style.color = failed === 0 ? 'var(--status-valid)' : 'var(--status-invalid)';
    </script>
  </body>
</html>
