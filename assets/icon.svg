<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060B19"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="tileBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#studioBg)"/>
  <!-- Clock Outer Bezel -->
  <circle cx="256" cy="236" r="154" fill="#F8FAFC" stroke="url(#goldRim)" stroke-width="14"/>
  <circle cx="256" cy="236" r="138" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 16.5"/>
  <!-- Clock Crosshairs -->
  <line x1="256" y1="88" x2="256" y2="384" stroke="#94A3B8" stroke-width="3"/>
  <line x1="108" y1="236" x2="404" y2="236" stroke="#94A3B8" stroke-width="3"/>
  <!-- Illuminated 30s Sweep Sector -->
  <path d="M256,236 L256,96 A140,140 0 0,1 377,306 Z" fill="#F59E0B" fill-opacity="0.24"/>
  <!-- Clock Hand -->
  <line x1="256" y1="236" x2="368" y2="300" stroke="#DC2626" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="236" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="5"/>
  <!-- Bottom Letter Tiles C-D-N -->
  <g transform="translate(88, 364)">
    <rect x="0" y="0" width="102" height="102" rx="14" fill="url(#tileBlue)" stroke="#93C5FD" stroke-width="3"/>
    <text x="51" y="72" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-weight="bold" font-size="64">C</text>
    <rect x="117" y="0" width="102" height="102" rx="14" fill="url(#tileBlue)" stroke="#93C5FD" stroke-width="3"/>
    <text x="168" y="72" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-weight="bold" font-size="64">9</text>
    <rect x="234" y="0" width="102" height="102" rx="14" fill="#F59E0B" stroke="#FDE68A" stroke-width="3"/>
    <text x="285" y="72" text-anchor="middle" fill="#0F172A" font-family="Georgia, serif" font-weight="bold" font-size="64">!</text>
  </g>
</svg>
