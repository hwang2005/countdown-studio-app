services:
  - type: web
    name: countdown-studio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:all
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_DISPLAYS_PER_ROOM
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: AUTH_TOKEN_SECRET
        sync: false
