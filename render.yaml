services:
  - type: web
    name: countdown-studio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:all
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # WebSocket endpoint baked into the frontend at build time. The Render
      # service URL is trusted by js/net/sync.js (*.onrender.com allowlist).
      # Change this if the backend runs on a different hostname.
      - key: VITE_STAGE_WS_URL
        value: "wss://countdown-studio-app.onrender.com/ws"
      # Browser origins allowed for HTTP/WebSocket access. Add extra frontend
      # domains here (comma-separated) when hosting the frontend elsewhere.
      - key: CORS_ORIGINS
        value: "https://countdown-studio.id.vn,https://www.countdown-studio.id.vn"
      - key: MAX_DISPLAYS_PER_ROOM
        value: "20"
      # Content-Security-Policy ships in Report-Only mode by default so the
      # production page keeps working while violations are reviewed. Flip this
      # to "enforce" once the browser console shows no CSP reports anymore.
      - key: CSP_MODE
        value: "report-only"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: AUTH_TOKEN_SECRET
        sync: false
      # Google Identity Services configuration. Set these in the Render
      # dashboard (do not commit the actual values to this file).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Resend SMTP relay for transactional email (Forgot credentials). The
      # password is a Resend API key (re_...); SMTP_FROM_EMAIL must be an
      # address on the Resend-verified domain. Set values in the dashboard.
      - key: SMTP_HOST
        value: "smtp.resend.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: "resend"
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: "no-reply@countdown-studio.id.vn"
      - key: SMTP_SENDER_NAME
        value: "Countdown Studio Support"
      - key: APP_URL
        value: "https://www.countdown-studio.id.vn"
